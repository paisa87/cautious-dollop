{% extends "base.html" %}
{% block title %}{{ 'Edit Vendor' if vendor else 'Add Vendor' }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('vendors_list') }}">Vendors</a> / {{ 'Edit' if vendor else 'Add' }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{{ 'Edit: ' + vendor.name if vendor else 'Add Vendor' }}</h4>
  <a href="{{ url_for('vendors_list') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<form method="post">
  <div class="card">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label">Vendor Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required value="{{ vendor.name if vendor else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Account Number</label>
        <input type="text" name="account_number" class="form-control" value="{{ vendor.account_number or '' if vendor else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Contact</label>
        <input type="text" name="contact" class="form-control" value="{{ vendor.contact or '' if vendor else '' }}" placeholder="Rep name / email">
      </div>
      <div class="col-md-6">
        <label class="form-label">Website</label>
        <input type="url" name="website" class="form-control" value="{{ vendor.website or '' if vendor else '' }}" placeholder="https://...">
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2">{{ vendor.notes or '' if vendor else '' }}</textarea>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Save Changes' if vendor else 'Add Vendor' }}</button>
    <a href="{{ url_for('vendors_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </div>
</form>
{% endblock %}
