{% extends "base.html" %}
{% block title %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('users_list') }}">Users</a> / {{ 'Edit' if user else 'Add' }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{{ 'Edit: ' + user.name if user else 'Add User' }}</h4>
  <a href="{{ url_for('users_list') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<form method="post">
  <div class="card">
    <div class="card-body row g-3">
      <div class="col-md-5">
        <label class="form-label">Full Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required value="{{ user.name if user else '' }}">
      </div>
      <div class="col-md-2">
        <label class="form-label">Initials <span class="text-danger">*</span></label>
        <input type="text" name="initials" class="form-control" required maxlength="5"
               value="{{ user.initials if user else '' }}" placeholder="e.g. ALP">
      </div>
      <div class="col-md-3">
        <label class="form-label">Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" required
               value="{{ user.username if user else '' }}" {{ 'readonly' if user }}>
      </div>
      <div class="col-md-2">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          {% for r in ['student', 'staff', 'instructor'] %}
          <option value="{{ r }}" {{ 'selected' if user and user.role == r }}>{{ r | title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Password {{ '(leave blank to keep current)' if user else '' }} <span class="text-danger">{{ '*' if not user }}</span></label>
        <input type="password" name="password" class="form-control" {{ 'required' if not user }}
               placeholder="{{ 'New password only if changing' if user else 'Set initial password' }}">
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Save' if user else 'Create User' }}</button>
    <a href="{{ url_for('users_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </div>
</form>
{% endblock %}
