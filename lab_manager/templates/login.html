<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — VG Lab Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1a3a5c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; }
    .login-card .card { border: none; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .login-header { background: #1a3a5c; color: #fff; border-radius: .375rem .375rem 0 0; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <i class="bi bi-activity" style="font-size:2rem"></i>
    <h4 class="mt-2 mb-0">VG Lab Manager</h4>
    <small class="text-info">VGCC Biotech Lab</small>
  </div>
  <div class="card">
    <div class="card-body p-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </form>
    </div>
  </div>
  <p class="text-center text-white-50 mt-3" style="font-size:.8rem">Contact the lab instructor if you need access.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
